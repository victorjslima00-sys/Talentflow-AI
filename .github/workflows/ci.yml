name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality Gate (Ruff, Mypy, Pytest, pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          uv sync

      - name: Lint with Ruff
        working-directory: ./backend
        run: |
          uv run ruff check .

      - name: Format Check with Ruff
        working-directory: ./backend
        run: |
          uv run ruff format --check .

      - name: Strict Type Check with Mypy
        working-directory: ./backend
        run: |
          uv run mypy src tests

      - name: Run Tests with Pytest
        working-directory: ./backend
        run: |
          uv run pytest -v

      - name: Dependency Security Audit (pip-audit)
        working-directory: ./backend
        run: |
          uv run pip-audit

  secrets-audit:
    name: Secrets & Credentials Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
